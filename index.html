<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b141a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AudioChat 5.2 — caricamento</title>
<style>
html,body{margin:0;height:100%;background:#0b141a;color:#e9edef;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}.box{text-align:center;padding:24px}.spin{width:34px;height:34px;margin:0 auto 14px;border:4px solid #263841;border-top-color:#00a884;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{color:#8696a0}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><b>AudioChat 5.2</b><br><small id="status">Caricamento applicazione…</small></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if(typeof DecompressionStream!=='function') throw new Error('DecompressionStream non supportato');
    const response=await fetch('deploy/v5_2/app.gz.b64?v=520',{cache:'no-store'});
    if(!response.ok) throw new Error(`Pacchetto: HTTP ${response.status}`);
    const b64=(await response.text()).trim();
    const binary=atob(b64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const app=await new Response(stream).text();
    if(!app.includes("const VERSION = '5.2.0-ios-rx-agc'")) throw new Error('Pacchetto incompleto');
    document.open();
    document.write(app);
    document.close();
  }catch(error){
    status.textContent='Errore di caricamento: '+error.message;
    console.error(error);
  }
})();
</script>
</body>
</html>
