<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b141a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>AudioChat 5.1 — caricamento</title>
<style>
html,body{margin:0;height:100%;background:#0b141a;color:#e9edef;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}.box{text-align:center;padding:24px}.spin{width:34px;height:34px;margin:0 auto 14px;border:4px solid #263841;border-top-color:#00a884;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{color:#8696a0}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><b>AudioChat 5.1</b><br><small id="status">Caricamento applicazione…</small></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const paths=Array.from({length:7},(_,i)=>`deploy/v5_1/${String(i).padStart(2,'0')}.part?v=510`);
    const parts=await Promise.all(paths.map(async path=>{
      const response=await fetch(path,{cache:'no-store'});
      if(!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
      return response.text();
    }));
    const app=parts.join('');
    if(!app.includes("const VERSION = '5.1.0-ios-tx-boost'")) throw new Error('Pacchetto incompleto');
    document.open();
    document.write(app);
    document.close();
  }catch(error){
    status.textContent='Errore di caricamento: '+error.message;
    console.error(error);
  }
})();
</script>
</body>
</html>
