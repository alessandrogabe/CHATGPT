<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071116">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AudioMesh 6.1 — caricamento</title>
<style>
html,body{margin:0;height:100%;background:#071116;color:#edf7f8;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}.box{text-align:center;padding:24px}.spin{width:38px;height:38px;margin:0 auto 16px;border:4px solid #20343e;border-top-color:#20d7a5;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{color:#91a8b1;display:block;margin-top:7px}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><b>AudioMesh 6.1</b><small id="status">Caricamento rete acustica sicura…</small></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if(typeof DecompressionStream!=='function') throw new Error('Il browser non supporta la decompressione richiesta');
    const paths=Array.from({length:5},(_,i)=>`deploy/v6_1_secure/${String(i).padStart(2,'0')}.b64part?v=610`);
    const parts=await Promise.all(paths.map(async path=>{
      const response=await fetch(path,{cache:'no-store'});
      if(!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
      return (await response.text()).trim();
    }));
    const binary=atob(parts.join(''));
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const app=await new Response(stream).text();
    if(!app.includes("const VERSION='6.1.0-secure-tdma'")) throw new Error('Pacchetto incompleto o versione errata');
    document.open();document.write(app);document.close();
  }catch(error){status.textContent='Errore di caricamento: '+error.message;console.error(error)}
})();
</script>
</body>
</html>
